name: Android APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 4. Install dependencies
      - name: Install npm dependencies
        run: npm ci

      # 5. Install Capacitor
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8.5.1 @capacitor/cli@8.5.1 @capacitor/android@8.5.1

      # 6. Build web app
      - name: Build web app
        run: npm run build

      # 7. Add Android platform
      - name: Add Android platform
        run: npx cap add android

      # 8. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 9. Diagnostics
      - name: Run diagnostics
        run: |
          echo "=== Node Version ==="
          node --version
          echo "=== Java Version ==="
          java -version
          echo "=== Gradle Version ==="
          cd android && ./gradlew --version

      # 10. Build APK (Debug)
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      # 11. Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk